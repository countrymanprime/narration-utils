# Link check for every Markdown file in the repository (.github/workflows/docs.yml, docs/operations/ci-and-releases.md#the-docs-link-check).
#
# Run it locally with the same command CI runs (install lychee 0.24.2: `cargo install lychee --locked`):
#   lychee --config .lychee.toml --offline .
# The input is the repository folder, so lychee reads only Markdown and skips what .gitignore skips (node_modules, .venv, .claude).

# Markdown only: the generated docs/ui pages are Markdown too, and the docs site has its own check of the built HTML.
extensions = ["md"]

# A relative link is a file that must exist and a `#fragment` a heading that must exist in it.
include_fragments = "anchor-only"

# The online run (schedule and manual start) only reports; this list is what it should not chase.
exclude_loopback = true
max_concurrency = 16
timeout = 20
max_retries = 2
# 429 is a host asking to slow down, not a dead link.
accept = ["200..=299", "429"]
# The dot folders hold Markdown too (the pull request template, the issue forms' docs), so they are read; .git is not.
hidden = true
# A tracked skill's templates hold placeholder links (NNNN-title.md) that only resolve once copied into a real log.
exclude_path = ['^\.git/', '(^|[\\/])\.claude[\\/]skills[\\/][^\\/]+[\\/]templates[\\/]']
