# Paste under `jobs:` in a workflow that runs on pull_request. Adjust the toolchain step to the repo's own.
  ui-visual:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: install node + dependencies the way this repo does
      - run: {{PM_EXEC}} playwright install --with-deps chromium
      - run: {{PM_RUN}} screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-visual-screenshots
          path: {{UI_ROOT}}/screenshots
          if-no-files-found: ignore
          retention-days: 7

  ui-atlas:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: install node + dependencies the way this repo does
      - run: {{PM_EXEC}} playwright install --with-deps chromium
      - run: {{PM_RUN}} atlas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-atlas-screenshots
          path: {{UI_ROOT}}/screenshots/atlas
          if-no-files-found: ignore
          retention-days: 7
