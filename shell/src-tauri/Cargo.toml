[package]
name = "narration-utils-shell"
version = "0.1.0"
description = "Native shell that hosts the Narration Utils React UI and supervises its Python backend for its whole lifetime."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "fs"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "process", "time", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
manuscript-import = { path = "../../shared/manuscript-import" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[bin]]
name = "narration-utils-shell"
path = "src/main.rs"
