[project]
name = "narration-utils"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av==18.1.0",
  "black==26.5.1",
  "ctranslate2==4.8.2",
  "fastapi==0.141.1",
  "faster-whisper==1.2.1",
  "httpx==0.28.1",
  "numpy==2.5.3",
  "phonemizer>=3.3",
  "piper-tts==1.8.0",
  "pronouncing>=0.2",
  "pyinstaller==6.22.3",
  "pypdf==6.18.1",
  "pytest==9.1.1",
  "python-docx==1.2.0",
  "ruff==0.16.7",
  "spacy>=3.7",
  "uvicorn==0.53.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 160
target-version = ["py311"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = [".venv", ".runtime", ".bootstrap"]

[tool.pytest.ini_options]
pythonpath = ["shared/python"]
addopts = "-p no:cacheprovider"
