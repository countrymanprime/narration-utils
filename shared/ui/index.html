<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Sets data-theme before first paint so the correct palette (see
      // shared/ui/src/styles.css's :root[data-theme='dark'] block) applies
      // immediately, instead of flashing light and then swapping to dark
      // once ThemeProvider (shared/ui/src/theme/ThemeContext.tsx) mounts.
      // Mirrors that module's readStoredPreference()/resolveTheme() logic;
      // kept duplicated here since inline scripts can't import it.
      (function () {
        try {
          var stored = localStorage.getItem('narration-ui-theme');
          var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (error) {
          // Storage/matchMedia unavailable - fall back to the default light palette.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Narration Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
