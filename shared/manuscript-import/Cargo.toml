[package]
name = "manuscript-import"
version = "0.1.0"
description = "Parses a source manuscript (.docx/.md/.pdf) into the draft JSON shape shared/python/narration_common/manuscript.py turns into the canonical manuscript.json. Invoked as a subprocess from Python - see manuscript.py::prepare_import."
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
regex = "1"
pdf-extract = "0.7"

[[bin]]
name = "manuscript-import"
path = "src/main.rs"
