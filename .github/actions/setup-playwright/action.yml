name: Set up Playwright
description: Install Chromium for the apps/ui Playwright suites, restoring the browser download from cache

# Run after setup-toolchain (pnpm dependencies must be installed).
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "value=$(pnpm --dir apps/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.value }}
    # With the browser cached this skips the download but still installs the system libraries.
    - shell: bash
      run: pnpm --dir apps/ui exec playwright install --with-deps chromium
