name: Setup toolchain
description: Install pnpm, Node, Go, Python, uv, and the pinned build tools shared by CI and release workflows

inputs:
  need-node:
    description: Install a Node runtime (some release scripts are plain Node with no deps)
    default: 'true'
  need-pnpm:
    description: Install pnpm and run `pnpm install --frozen-lockfile` (implies need-node)
    default: 'true'
  need-python:
    description: Install Python and uv, and sync the locked environment
    default: 'true'
  need-go:
    description: Install Go
    default: 'true'
  need-wails-tools:
    description: Install the pinned Wails CLI and staticcheck (implies need-go)
    default: 'true'
  need-stylua:
    description: Install the pinned standalone StyLua binary
    default: 'true'
  need-linux-native-deps:
    description: Install the native GTK/WebKit libs needed to build the Wails app on Linux
    default: 'true'

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux' && inputs.need-linux-native-deps == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - if: inputs.need-pnpm == 'true'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with: { version: 11.27.0 }
    - if: inputs.need-node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: ${{ inputs.need-pnpm == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml
    - if: inputs.need-go == 'true' || inputs.need-wails-tools == 'true'
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'
        cache-dependency-path: shell/go.sum
    - if: inputs.need-python == 'true'
      uses: actions/setup-python@v5
      with: { python-version: '3.12' }
    - if: inputs.need-python == 'true'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: 0.12.15
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - if: inputs.need-wails-tools == 'true'
      name: Install pinned Go tools
      shell: bash
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
        go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
    - if: inputs.need-stylua == 'true'
      name: Install pinned standalone StyLua
      uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4.1.0
      with:
        token: ${{ github.token }}
        version: v2.1.0
        args: false
    - if: inputs.need-pnpm == 'true'
      name: Install pnpm dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.need-python == 'true'
      name: Sync Python dependencies
      shell: bash
      run: uv sync --locked
