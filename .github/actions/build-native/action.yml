name: Build native package
description: Build the Wails app on the current runner and package it as release-assets/narration-utils-<version>-<platform>.<ext> with a .sha256 beside it (Windows also gets its setup program and notices)

inputs:
  platform:
    description: windows-x64, macos-arm64, or linux-x64 (the table lives in scripts/release/assets.mjs)
    required: true
  version:
    description: Release version to stamp into the build; empty keeps the checked-in version
    default: ''
  tag:
    description: The git tag the release is built from, for the source offer in THIRD-PARTY-NOTICES.txt (Windows); empty means v<version>-rc
    default: ''
  reuse-freeze:
    description: Restore the frozen Python sidecars from the build-output cache when every input of the freeze is unchanged ('false' freezes from scratch)
    default: 'true'

# The caller checks the repository out and runs on the matching OS; the `ui-dist`
# artifact must already exist in this workflow run (see _ui-dist.yml).
runs:
  using: composite
  steps:
    # Windows also writes the third-party notices, which read the UI's production dependencies (`pnpm licenses`), so it installs the UI's
    # packages (only that project) and the others do not.
    - uses: ./.github/actions/setup-toolchain
      with:
        need-pnpm: ${{ inputs.platform == 'windows-x64' && 'true' || 'false' }}
        pnpm-filter: narration-utils-ui
        need-stylua: 'false'
    - if: inputs.version != ''
      name: Apply the computed release version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        npm pkg set version="$VERSION"
        node scripts/release/sync-version.mjs
    - name: Clear frontend dist placeholder
      shell: bash
      run: rm -rf apps/desktop/cmd/narration-utils/frontend/dist
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ui-dist
        path: apps/desktop/cmd/narration-utils/frontend/dist
    # The Windows setup program is built by Wails with NSIS (`-nsis`, definition in apps/desktop/build/windows/installer, docs/adr/0082).
    # The hosted runner does not ship makensis (`wails doctor` lists nsis as optional and available, not installed), and Wails only
    # warns and skips the installer when it is missing, so it is installed here at a pinned version. The build fails if -nsis was
    # asked for and no installer came out (scripts/release/wails-build.mjs), so a runner image change cannot silently drop it.
    - name: Install NSIS (makensis) for the Windows setup program
      if: inputs.platform == 'windows-x64'
      shell: bash
      env:
        NSIS_VERSION: 3.11.0
      run: |
        if command -v makensis > /dev/null 2>&1; then
          echo "makensis was already on PATH: $(command -v makensis)"
        else
          choco install nsis --version="$NSIS_VERSION" --no-progress -y
        fi
        # The installer puts makensis in Program Files (x86); the build step below adds that folder to its own PATH.
        PATH="$PATH:/c/Program Files (x86)/NSIS"
        echo "makensis version: $(makensis -VERSION)"
    # The PyInstaller freeze of the three sidecars is a pure function of its inputs: the sidecar and shared Python sources, the locked
    # dependencies, the freeze script and the interpreter. The key hashes all of them, so a hit is the same freeze a cold run would make
    # (docs/operations/ci-and-releases.md "The sidecar freeze cache"). It is a build output, never a test verdict: the smoke test and
    # the notices below still run on the packaged app every time. Only the executables and the tables of contents the notices read are
    # kept, not PyInstaller's work files. Restored only on an exact key; saved only from `main` (below), so a pull request cannot
    # write what a release is built from.
    - id: freeze-key
      if: inputs.reuse-freeze == 'true'
      name: Key the sidecar freeze
      shell: bash
      run: echo "python=$(uv run python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
    - id: freeze-cache
      if: inputs.reuse-freeze == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          .release-build/*/dist
          .release-build/*/work/*/*.toc
        key: sidecar-freeze-${{ runner.os }}-${{ runner.arch }}-py${{ steps.freeze-key.outputs.python }}-${{ hashFiles('sidecars/**', 'libs/python/**', 'pyproject.toml', 'uv.lock', 'scripts/release/prepare-resources.py') }}
    - name: Build native package
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        REUSE_FREEZE: ${{ steps.freeze-cache.outputs.cache-hit == 'true' && 'true' || '' }}
      run: |
        case "$PLATFORM" in
          linux-x64)   wails_args=(-tags webkit2_41) ;;
          windows-x64) wails_args=(-nsis); PATH="$PATH:/c/Program Files (x86)/NSIS" ;;
          *)           wails_args=() ;;
        esac
        uv run python scripts/release/prepare-resources.py --clean ${REUSE_FREEZE:+--reuse}
        node scripts/release/verify-installable.mjs
        cd apps/desktop
        wails doctor
        node ../../scripts/release/wails-build.mjs -s "${wails_args[@]}"
    # Wails downloads Microsoft's WebView2 bootstrapper while it builds the installer and embeds it, and the installer runs it when the
    # runtime is missing. Nothing pins that download, so check it is still the file Microsoft signed before a release is built from it.
    - name: Check the embedded WebView2 bootstrapper is signed by Microsoft
      if: inputs.platform == 'windows-x64'
      shell: pwsh
      run: |
        $file = 'apps/desktop/build/windows/installer/tmp/MicrosoftEdgeWebview2Setup.exe'
        $signature = Get-AuthenticodeSignature -FilePath $file
        $subject = "$($signature.SignerCertificate.Subject)"
        Write-Host "WebView2 bootstrapper signature: $($signature.Status), $subject"
        if ($signature.Status -ne 'Valid' -or $subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') {
          throw "The embedded WebView2 bootstrapper is not validly signed by Microsoft Corporation."
        }
    # The packaged app proves it can start: `--smoke` unpacks the embedded resources, starts every frozen sidecar, checks that the frozen
    # Story Bible sidecar can load its dictionary and espeak-ng data and the Teleprompter its Moonshine library, loads the four asset catalogs, writes the asset cache and checks the
    # REAPER package, then exits (no window, no download; apps/desktop/smoke.go). It runs before packaging, so a build that cannot start
    # is never published. Windows is the supported platform; the macOS and Linux previews are not smoked yet. LocalAppData points at an
    # empty folder so the run leaves the runner's real cache alone. (A composite step has no timeout-minutes; the smoke test bounds every
    # sidecar command itself, at 90 seconds, and the calling job has its own limit.)
    - name: Smoke test the packaged app
      if: inputs.platform == 'windows-x64'
      shell: bash
      env:
        SMOKE_CACHE: ${{ runner.temp }}\smoke-cache
        SMOKE_REPORT: ${{ runner.temp }}\smoke-report.json
      run: |
        mkdir -p "$SMOKE_CACHE"
        status=0
        LOCALAPPDATA="$SMOKE_CACHE" apps/desktop/build/bin/narration-utils.exe --smoke --report "$SMOKE_REPORT" || status=$?
        # A GUI-subsystem program's stdout can be lost, so the report file is what is shown and summarised.
        if [ -f "$SMOKE_REPORT" ]; then
          cat "$SMOKE_REPORT"
          { echo '### Packaged app smoke test'; echo '```json'; cat "$SMOKE_REPORT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"
    # The third-party licences and the source offer (owner decision D17, docs/operations/ci-and-releases.md "Third-party notices"). Written
    # from what this very build contains: the frozen sidecars' tables of contents, the UI's production dependencies and the Go modules of
    # the Windows build. It refuses to write a report it cannot trust (an unknown licence, a component with no licence text, a missing
    # direct dependency), which fails the build, on purpose: a release without its notices is not a release. It is packaged as its own
    # asset beside the zip and the setup program (scripts/release/assets.mjs) and attested with them.
    - name: Write the third-party notices
      if: inputs.platform == 'windows-x64'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TAG: ${{ inputs.tag }}
        COMMIT: ${{ github.sha }}
      run: |
        version="${INPUT_VERSION:-$(node -p "require('./package.json').version")}"
        tag="${INPUT_TAG:-v${version}-rc}"
        # The commit is in the source offer too: a release candidate's tag is pruned once newer ones exist, and the promoted release keeps
        # these very bytes (prerelease.yml keeps the newest ten candidates).
        uv run python scripts/licenses/notices.py --version "$version" --tag "$tag" --commit "$COMMIT" --out apps/desktop/build/bin/THIRD-PARTY-NOTICES.txt
    # After the smoke test and the notices (Windows), so a freeze that cannot start or cannot be read whole is never kept.
    - if: inputs.reuse-freeze == 'true' && steps.freeze-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          .release-build/*/dist
          .release-build/*/work/*/*.toc
        key: ${{ steps.freeze-cache.outputs.cache-primary-key }}
    # Named for the version in the root package.json, which the step above set to the release version (docs/adr/0197).
    - name: Package the release asset
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: node scripts/release/assets.mjs package "$PLATFORM"
    - name: Show the release files
      shell: bash
      run: |
        ls -l release-assets
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          { echo '### Release files'; echo '```'; ls -l release-assets; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        fi
