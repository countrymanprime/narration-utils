name: Dependency review
# Requires the dependency graph (enabled with Dependabot alerts). Advisory, not a required check.
on:
  pull_request:
    branches: [main]
permissions: { contents: read }
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Only runtime dependencies block: the dev tools (test runners, linters, the docs generator) are not shipped, and the
          # licence gate is about what a narrator receives (docs security and hygiene PRD, phase 9; owner decision Q14).
          fail-on-scopes: runtime
          # SPDX ids. The project is AGPL-3.0-or-later (ADR 0039, owner decision D17), so the GPL, AGPL and LGPL families it may
          # bundle are allowed and GPL-2.0-only is not (incompatible). The permissive and attribution licences are the ones the
          # notices already list (`scripts/licenses/notices.py`); a licence outside the list needs a person to read it and then add
          # it here, in the same pull request that adds the dependency. The action judges only what a pull request adds or
          # changes and only warns when a licence is undetected, so `scripts/licenses/tests/test_dependency_review.py` holds the
          # list to what the release ships. OFL-1.1 is the SIL Open Font License of the bundled typefaces (@fontsource/*, #238),
          # read and accepted by the owner: the fonts may be bundled and redistributed with the licence text, not sold alone.
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, CC-BY-4.0, CC0-1.0, ISC, MIT, MIT-0, MPL-2.0, OFL-1.1,
            PSF-2.0, Python-2.0, Unlicense, Zlib,
            AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later
