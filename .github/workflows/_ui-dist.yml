name: UI dist
on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA to build; empty builds the triggering commit
        type: string
        default: ''
permissions: { contents: read }
jobs:
  build:
    # Its own job so the native build can start as soon as the UI is built, in parallel with the
    # lint/test jobs in _quality.yml, instead of waiting for all of them.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - run: pnpm --dir apps/ui run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: apps/ui/dist
          if-no-files-found: error
          retention-days: 1
