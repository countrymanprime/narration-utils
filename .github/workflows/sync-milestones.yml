name: Sync milestones
on:
  push:
    branches: [main]
    paths:
      - config/roadmap.json
      - .github/workflows/sync-milestones.yml
      - scripts/github/**
  workflow_dispatch: {}
permissions: { contents: read, issues: write }
concurrency:
  group: sync-milestones
  cancel-in-progress: false
jobs:
  sync:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/github/sync-milestones.mjs --apply
        env:
          GH_TOKEN: ${{ github.token }}
