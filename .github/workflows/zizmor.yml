name: zizmor
# Static analysis of the workflows themselves: unpinned actions, credentials left in .git/config, template
# injection, excessive permissions, dangerous triggers. Config and every suppression (each with a reason) live in
# .github/zizmor.yml. It runs on every pull request with no path filter, so a change to a workflow, a composite
# action or dependabot.yml is always judged.
# Advisory at first (continue-on-error on the zizmor step); phase 2 of the supply-chain hardening PRD pins every action and
# removes that line, after which a finding fails the check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
# No token scope by default: the job asks for exactly what it reads.
permissions: {}
concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read # to read the repository and to answer zizmor's online audits (impostor commits, known-vulnerable actions)
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        # Advisory until the actions are pinned (removed in phase 2). On the step, not the job, so a finding
        # leaves a green check with the findings in the log rather than a red one.
        continue-on-error: true
        with:
          # Plain output, not SARIF: SARIF never sets a failing exit code, and a plain run needs no
          # `security-events: write`, so it also works on Dependabot's read-only token.
          advanced-security: false
          persona: regular
          # The zizmor binary is pinned here rather than left at the action's default of `latest`.
          version: 1.30.1
