name: Attach platform build
# Builds one platform from an existing release tag and uploads its asset to that release. The
# caller decides which platform; see build-macos.yml and build-linux.yml.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach to, for example v0.2.1-rc
        type: string
        required: true
      platform:
        description: macos-arm64 or linux-x64 (the table lives in scripts/release/assets.mjs)
        type: string
        required: true
      runner:
        type: string
        required: true
permissions: { contents: read }
jobs:
  check:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - id: check
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc)?$'; then
            echo "::error::The tag must look like v0.2.1-rc or v0.2.1."
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          # The version bump is applied at build time and never committed, so the tag's tree still
          # carries the previous version; derive the one to stamp from the tag itself.
          version="${TAG#v}"
          echo "version=${version%-rc}" >> "$GITHUB_OUTPUT"

  # Built here rather than reused from the prerelease run: this workflow can start later, on its
  # own, when that run's artifacts are gone.
  ui-dist:
    needs: check
    uses: ./.github/workflows/_ui-dist.yml
    with:
      ref: ${{ inputs.tag }}

  attach:
    name: Build and attach ${{ inputs.platform }}
    needs: [check, ui-dist]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # to sign the build provenance (actions/attest)
      attestations: write # to store it
      artifact-metadata: write # to record the artifact storage record (per the action README)
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/build-native
        with:
          platform: ${{ inputs.platform }}
          version: ${{ needs.check.outputs.version }}
      # Build provenance for this platform's asset and checksum, and for the binary inside the archive where there is
      # one (a macOS .app is a directory, so only its zip is a subject). Before the upload, so an unattested asset is
      # never attached. The signer of these attestations is this reusable workflow, not build-macos.yml or build-linux.yml.
      - name: Attest the release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*
            apps/desktop/build/bin/narration-utils-shell*
      # --clobber makes re-running this workflow for the same tag safe.
      - name: Attach to the release
        run: gh release upload "$TAG" release-assets/* --clobber
