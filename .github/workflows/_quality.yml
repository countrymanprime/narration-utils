name: Quality
on:
  workflow_call: {}
permissions: { contents: read }
jobs:
  js:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - run: pnpm --dir apps/ui run lint:ci
      - run: pnpm --dir apps/ui run format:check
      - run: pnpm --dir apps/ui test

  ui-visual:
    # Captures every {page, state, viewport} of the mock-backed app and fails on
    # errors, sideways overflow, blank or duplicate screenshots (see
    # apps/ui/tests/visual/global-setup.ts). Not a pixel-diff gate.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - uses: ./.github/actions/setup-playwright
      - run: pnpm --dir apps/ui run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-visual-screenshots
          path: apps/ui/screenshots
          if-no-files-found: ignore
          retention-days: 7
  ui-atlas:
    # The component library: every Storybook story x light/dark x wide/narrow,
    # with play() interactions, axe accessibility and overflow checks
    # (apps/ui/tests/atlas). `pnpm atlas` builds Storybook first.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - uses: ./.github/actions/setup-playwright
      - run: pnpm --dir apps/ui run atlas
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-atlas-screenshots
          path: apps/ui/screenshots/atlas
          if-no-files-found: ignore
          retention-days: 7
  ui-atlas-kit:
    # The reusable UI-atlas plugin under tools/ui-atlas-kit: CLI, hooks, and a check that
    # apps/ui has not drifted from the vendored core files the kit ships.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - run: node --test tools/ui-atlas-kit/test/*.test.mjs
  repo-scripts:
    # Plain-Node scripts with no dependencies: the ones that keep GitHub metadata (labels,
    # milestones) in step with the repo, the release scripts (version sync, asset packaging), and the
    # layout guard (scripts/ci/layout.test.mjs: top-level allowlist and retired-path check).
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test scripts/ci/*.test.mjs scripts/github/*.test.mjs scripts/release/*.test.mjs
  python:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-node: 'false'
          need-pnpm: 'false'
          need-go: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  lua:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ github.token }}
          version: v2.1.0
          args: --check integrations/reaper

  go:
    # Windows only: it is the supported platform, and Linux's native libraries are installed only
    # by the optional Linux build (build-linux.yml).
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-node: 'false'
          need-pnpm: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-staticcheck: 'true'
          need-stylua: 'false'
      - name: gofmt check
        shell: bash
        run: |
          files=$(gofmt -l ./apps/desktop)
          if [ -n "$files" ]; then
            echo "Run gofmt on:"
            echo "$files"
            exit 1
          fi
      - run: go -C apps/desktop vet ./...
      - run: go -C apps/desktop test -race ./...
      - run: staticcheck ./...
        working-directory: apps/desktop
