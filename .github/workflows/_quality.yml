name: Quality
on:
  workflow_call: {}
permissions: { contents: read }
jobs:
  js:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - run: pnpm --dir shared/ui run lint:ci
      - run: pnpm --dir shared/ui run format:check
      - run: pnpm --dir shared/ui test
      - run: pnpm --dir shared/ui run build
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: shared/ui/dist
          if-no-files-found: error

  ui-visual:
    # Captures every {page, state, viewport} of the mock-backed app and fails on
    # errors, sideways overflow, blank or duplicate screenshots (see
    # shared/ui/tests/visual/global-setup.ts). Not a pixel-diff gate.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - run: pnpm --dir shared/ui exec playwright install --with-deps chromium
      - run: pnpm --dir shared/ui run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-visual-screenshots
          path: shared/ui/screenshots
          if-no-files-found: ignore
          retention-days: 7
  ui-atlas:
    # The component library: every Storybook story x light/dark x wide/narrow,
    # with play() interactions, axe accessibility and overflow checks
    # (shared/ui/tests/atlas). `pnpm atlas` builds Storybook first.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - run: pnpm --dir shared/ui exec playwright install --with-deps chromium
      - run: pnpm --dir shared/ui run atlas
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-atlas-screenshots
          path: shared/ui/screenshots/atlas
          if-no-files-found: ignore
          retention-days: 7
  python:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-node: 'false'
          need-pnpm: 'false'
          need-go: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  lua:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ github.token }}
          version: v2.1.0
          args: --check shared/reaper

  go:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          need-node: 'false'
          need-pnpm: 'false'
          need-python: 'false'
          need-stylua: 'false'
      - name: gofmt check
        shell: bash
        run: |
          files=$(gofmt -l ./shell)
          if [ -n "$files" ]; then
            echo "Run gofmt on:"
            echo "$files"
            exit 1
          fi
      - run: go -C shell vet ./...
      - run: go -C shell test -race ./...
      - run: staticcheck ./...
        working-directory: shell
