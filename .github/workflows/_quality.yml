name: Quality
on:
  workflow_call: {}
permissions: { contents: read }
# Every job runs its Nx targets through .github/actions/nx-run: on a pull request only the projects
# the change affects (see each project's project.json and `implicitDependencies`), otherwise all of
# them. The two Playwright jobs keep their own `run:` steps (the atlas kit's audit looks for them) and
# use .github/actions/nx-affected to decide whether to run. The jobs and their names are unchanged
# (docs/operations/ci-and-releases.md lists them as GitHub shows them; no ruleset requires any of them). Checkouts
# fetch full history so Nx can diff against the base branch.
jobs:
  js:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - uses: ./.github/actions/nx-run
        with:
          targets: lint format test
          projects: narration-utils-ui
      # Knip reads every workspace, so a change anywhere can leave an unused file or export: `always`.
      - uses: ./.github/actions/nx-run
        with:
          targets: knip
          projects: narration-utils
          always: 'true'

  ui-visual:
    # Captures every {page, state, viewport} of the mock-backed app and fails on
    # errors, sideways overflow, blank or duplicate screenshots (see
    # apps/ui/tests/visual/global-setup.ts). Not a pixel-diff gate.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: narration-utils-ui
      - if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-playwright
      - if: steps.scope.outputs.affected == 'true'
        run: pnpm --dir apps/ui run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-visual-screenshots
          path: apps/ui/screenshots
          if-no-files-found: ignore
          retention-days: 7
      # Playwright keeps a trace only for a failing test (`trace: 'retain-on-failure'`), so a green run has nothing
      # to upload and a red one ships a trace.zip per failing test. Open it with `playwright show-trace`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-visual-traces
          path: apps/ui/test-results
          if-no-files-found: ignore
          retention-days: 3
  ui-atlas:
    # The component library: every Storybook story x light/dark x wide/narrow,
    # with play() interactions, axe accessibility and overflow checks
    # (apps/ui/tests/atlas). `pnpm atlas` builds Storybook first.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: scope
        uses: ./.github/actions/nx-affected
        with:
          projects: narration-utils-ui
      - if: steps.scope.outputs.affected == 'true'
        uses: ./.github/actions/setup-playwright
      - if: steps.scope.outputs.affected == 'true'
        run: pnpm --dir apps/ui run atlas
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-atlas-screenshots
          path: apps/ui/screenshots/atlas
          if-no-files-found: ignore
          retention-days: 7
  ui-atlas-kit:
    # The reusable UI-atlas plugin under tools/ui-atlas-kit: CLI, hooks, and a check that
    # apps/ui has not drifted from the vendored core files the kit ships. It runs on every pull
    # request (`always`), because that drift check reads apps/ui but Nx does not see the link.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          pnpm-filter: narration-utils
      - uses: ./.github/actions/nx-run
        with:
          targets: test
          projects: ui-atlas-kit
          always: 'true'
  repo-scripts:
    # Plain-Node scripts with no dependencies: the ones that keep GitHub metadata (labels,
    # milestones) in step with the repo, the release scripts (version sync, asset packaging), and the
    # layout guard (scripts/ci/layout.test.mjs: top-level allowlist and retired-path check).
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          pnpm-filter: narration-utils
      # `always`: the layout and project guards read every tracked file, so a change anywhere can break them.
      - uses: ./.github/actions/nx-run
        with:
          targets: test-node
          projects: repo-scripts
          always: 'true'
  python:
    # ruff and pytest for libs/python, the sidecars, scripts/ (release tests) and tests/fixtures.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          pnpm-filter: narration-utils
      - uses: ./.github/actions/nx-run
        with:
          targets: lint test
          projects: tag:toolchain:python,fixtures

  lua:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-linux-native-deps: 'false'
          pnpm-filter: narration-utils
      - uses: ./.github/actions/nx-run
        with:
          targets: lint
          projects: reaper

  go:
    # Windows only: it is the supported platform, and Linux's native libraries are installed only
    # by the optional Linux build (build-linux.yml). Runs gofmt, go vet and golangci-lint (the lint
    # target), then the tests with the race detector (the `ci` configuration of the test target), then
    # the teleprompter and shutdown tests on one and on four CPUs (`test-schedules`): an ordering bug
    # between goroutines that hides on the default scheduler fails there on demand.
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-toolchain
        with:
          need-python: 'false'
          need-wails-tools: 'false'
          need-golangci-lint: 'true'
          need-stylua: 'false'
          pnpm-filter: narration-utils
      - uses: ./.github/actions/nx-run
        with:
          targets: lint test test-schedules
          projects: narration-utils-shell
          configuration: ci
