name: Pages
# Publishes the public site to GitHub Pages after every push to main, and by hand: the docs (tools/docs-site, ADR 0083,
# built from docs/ by MkDocs) at the root and the Storybook component atlas (apps/ui) under /storybook/. It is served at
# https://<owner>.github.io/narration-utils/ once the owner sets Settings > Pages > Source to "GitHub Actions" (an
# owner-only setting, see docs/operations/github-workflow.md); until then the deploy job fails with GitHub's "Pages is not
# enabled" message and the build job still proves the site builds.
#
# A pull request that changes the docs or the site project also runs the build job (path filter below), and nothing else:
# ci.yml skips documentation-only pull requests, and those are exactly the ones that can break a link. That run has a
# read-only token, no secret, uploads nothing and never reaches the deploy job, which also refuses any ref but main (a
# manual start from a branch builds and stops). A fork's pull request gets a read-only token by GitHub's own rule.
# The token is read-only everywhere except the deploy job, which alone holds `pages: write` (create the deployment) and
# `id-token: write` (prove to Pages that the artifact came from this workflow run).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docs/**
      - tools/docs-site/**
      - apps/ui/.storybook/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/pages.yml
  workflow_dispatch: {}
permissions: {}
# One deployment at a time, and a running one finishes: cancelling a deploy half way leaves the site stale. A pull
# request run has its own group and is replaced by the next push to that pull request.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          python-sync-args: --only-group docs
      - name: Build Storybook
        run: pnpm --dir apps/ui run build-storybook
      # The same target `pnpm check` runs: a strict MkDocs build of docs/ (a dead link or heading link fails it) and the
      # link check over the built HTML. Links to pages the include list leaves out point at this commit on GitHub.
      - name: Build the docs site
        env:
          DOCS_SITE_REF: ${{ github.sha }}
        run: pnpm exec nx run docs-site:build --skip-nx-cache
      - name: Add Storybook beside the docs and check every link, including the one to it
        run: |
          set -euo pipefail
          cp -r apps/ui/storybook-static tools/docs-site/build/site/storybook
          .venv/bin/python tools/docs-site/check_site.py tools/docs-site/build/site --base /narration-utils/ \
            --site-url https://countrymanprime.github.io/narration-utils/ --require storybook/index.html --require index.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: tools/docs-site/build/site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
