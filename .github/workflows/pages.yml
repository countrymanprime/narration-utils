name: Pages
# PAUSED (owner decision D75, 2026-09-27; narrowed further 2026-09-27, ADR 0415): nothing is published until the main
# app's development is done and the site is reworked, and this workflow no longer runs on a pull request either (it
# used to be the docs link check, but `Docs / Links (offline)` in .github/workflows/docs.yml already checks every
# Markdown link and heading anchor on every pull request with lychee, and `Docs / Markdown lint (changed files)` in
# the same workflow now catches Markdown style issues; neither needs the site built). Only `workflow_dispatch` starts
# this workflow now: a manual run builds, and deploys only when its `publish` input is ticked on main.
#
# Publishes the public site to GitHub Pages, by hand: the docs (tools/docs-site, ADR 0083, built from docs/ by MkDocs)
# at the root, the Storybook component atlas (apps/ui) under /storybook/, and a browser-runnable demo of the app
# (apps/ui built with VITE_USE_MOCK_API=1, docs/prds/public-app-demo.prd.md) under /demo/. It is served at
# https://<owner>.github.io/narration-utils/ once the owner sets Settings > Pages > Source to "GitHub Actions" (an
# owner-only setting, see docs/operations/github-workflow.md); until then the deploy job fails with GitHub's "Pages is not
# enabled" message and the build job still proves the site builds.
#
# To resume after D75: restore both triggers below and drop the `narrowed further` clause above.
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       paths:
#         - docs/**
#         - tools/docs-site/**
#         - apps/ui/.storybook/**
#         - apps/ui/vite.config.ts
#         - apps/ui/.env.demo
#         - apps/ui/src/components/layout/**
#         - pyproject.toml
#         - uv.lock
#         - .github/workflows/pages.yml
#     workflow_dispatch:
#       inputs:
#         publish: { ... }
#
# A restored pull request run has a read-only token, no secret, uploads nothing and never reaches the deploy job, which
# also refuses any ref but main (a manual start from a branch builds and stops). A fork's pull request gets a read-only
# token by GitHub's own rule. The token is read-only everywhere except the deploy job, which alone holds `pages: write`
# (create the deployment) and `id-token: write` (prove to Pages that the artifact came from this workflow run).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the built site to GitHub Pages (paused by D75; only on main)
        type: boolean
        default: false
permissions: {}
# One deployment at a time, and a running one finishes: cancelling a deploy half way leaves the site stale. Only
# workflow_dispatch starts this workflow now, so there is one group; the `pull_request` branch of this expression is
# dead until the trigger above is restored, and restoring it needs no change here.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
          python-sync-args: --only-group docs
      - name: Build Storybook
        run: pnpm --dir apps/ui run build-storybook
      # The mock build (apps/ui/.env.demo, VITE_USE_MOCK_API=1) run through Vite's `demo` mode so its own base path
      # resolves assets under /narration-utils/demo/ (docs/prds/public-app-demo.prd.md D3). No backend, no secret: same
      # mock API and fixture data the Playwright visual suite and Storybook already build against.
      - name: Build the demo
        run: pnpm --dir apps/ui run build:demo
      # A strict MkDocs build of docs/ (a dead link or heading link fails it) and the link check over the built HTML.
      # Links to pages the include list leaves out point at this commit on GitHub. This is the `docs-site:build-site`
      # target, kept out of `pnpm check` and the `_quality.yml` gate while Pages is paused (ADR 0415) — this workflow
      # is the one place it still runs, since it needs the built site to add Storybook and the demo beside it below.
      - name: Build the docs site
        env:
          DOCS_SITE_REF: ${{ github.sha }}
        run: pnpm exec nx run docs-site:build-site --skip-nx-cache
      - name: Add Storybook and the demo beside the docs and check every link, including the ones to them
        run: |
          set -euo pipefail
          cp -r apps/ui/storybook-static tools/docs-site/build/site/storybook
          cp -r apps/ui/dist/demo tools/docs-site/build/site/demo
          .venv/bin/python tools/docs-site/check_site.py tools/docs-site/build/site --base /narration-utils/ \
            --site-url https://countrymanprime.github.io/narration-utils/ --require storybook/index.html --require index.html \
            --require demo/index.html
      - if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: tools/docs-site/build/site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
