name: Create pre-release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-prerelease
  cancel-in-progress: false

jobs:
  version:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Calculate the next beta version with Nx Release
        run: npx nx release version --preid beta
      - name: Synchronize every application version source
        run: node scripts/release/sync-version.mjs
      - id: version
        name: Commit generated metadata and tag the candidate
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          git add package.json package-lock.json shared/ui/package.json shared/ui/package-lock.json shell/package.json shell/src-tauri/tauri.conf.json shell/src-tauri/Cargo.toml shared/manuscript-import/Cargo.toml Cargo.lock
          test ! -f CHANGELOG.md || git add CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip release]"
          git tag "${TAG}"
          git push origin HEAD:main --follow-tags
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            command: npm --prefix shell run build:windows
          - name: macos-x64
            os: macos-13
            command: npm --prefix shell run build:macos
          - name: macos-arm64
            os: macos-14
            command: npm --prefix shell run build:macos
          - name: linux-x64
            os: ubuntu-latest
            command: npm --prefix shell run build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/ui/package-lock.json
            shell/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: narration-utils-${{ runner.os }}-${{ runner.arch }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: |
          npm --prefix shared/ui ci
          npm --prefix shell ci
          python -m pip install -r requirements.lock
          npm --prefix shared/ui run build
          python scripts/release/prepare-resources.py --clean
          node scripts/release/verify-installable.mjs
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: target/release/bundle
          if-no-files-found: error

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: release-*
          merge-multiple: true
      - name: Collect assets and checksums
        env:
          BUNDLE_DIRS: bundles
          RELEASE_ASSETS_DIR: release-assets
        run: node scripts/release/collect-assets.mjs
      - name: Generate beta release notes
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: node scripts/release/generate-notes.mjs "$RELEASE_TAG"
      - name: Publish the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" release-assets/* --prerelease --title "$TAG" --notes-file release-notes.md
