name: Prerelease
on:
  workflow_dispatch:
    inputs:
      cold-freeze:
        description: Freeze the Python sidecars from scratch instead of restoring them from the build-output cache
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
permissions: { contents: read }
concurrency:
  group: prerelease
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
  ui-dist:
    uses: ./.github/workflows/_ui-dist.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.compute.outputs.release }}
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          need-go: 'false'
          need-python: 'false'
          need-wails-tools: 'false'
          need-stylua: 'false'
          need-linux-native-deps: 'false'
      - id: compute
        name: Compute the next release candidate from conventional commits
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          # nx.json's releaseTag.pattern (v{version}-rc) makes nx treat the latest RC tag as the
          # current version and bump past it (v0.2.0-rc -> 0.2.1).
          pnpm exec nx release version
          node scripts/release/sync-version.mjs
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "No releasable changes since the latest release candidate; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-rc" >> "$GITHUB_OUTPUT"

  # Windows is the supported platform: its build creates the GitHub prerelease, and that is the only
  # build a release needs. macOS and Linux are optional extras started at the end of the publish job.
  #
  # The build needs only the UI bundle and the version, so it runs beside the quality jobs instead of after them;
  # only publishing waits for a green quality. It holds no write permission: the job that runs the third-party
  # build tooling (PyInstaller, Wails, NSIS, pnpm) cannot create a release, a tag or an attestation.
  windows-build:
    name: Windows build
    needs: [ui-dist, version]
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      checksums: ${{ steps.checksums.outputs.checksums }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          platform: windows-x64
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          reuse-freeze: ${{ inputs.cold-freeze && 'false' || 'true' }}
      # The digests travel to the publish job as a job output, apart from the artifact, and publish refuses files that
      # do not match them: what it attests and releases are the bytes this job built.
      - id: checksums
        name: Record the digests of the files to publish
        run: |
          {
            echo 'checksums<<EOF'
            # Binary mode (-b) prints `<hash> *<file>` on Windows and Linux alike.
            (cd release-assets && sha256sum -b -- *) | sed 's| \*| *release-assets/|'
            (cd apps/desktop/build/bin && sha256sum -b narration-utils.exe) | sed 's| \*| *bin/|'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Stage the files to publish
        run: |
          mkdir -p publish/bin
          cp -r release-assets publish/
          cp apps/desktop/build/bin/narration-utils.exe publish/bin/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: publish/
          if-no-files-found: error
          retention-days: 1

  # Attests, prunes and publishes what windows-build made, once every quality job is green. A red quality job
  # leaves no release, no tag and no attestation.
  publish:
    name: Windows release
    needs: [quality, windows-build, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write # to dispatch the optional macOS and Linux builds
      id-token: write # to sign the build provenance (actions/attest)
      attestations: write # to store it
      artifact-metadata: write # to record the artifact storage record (per the action README)
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: .
      - name: Check the files are the ones the build recorded
        env:
          CHECKSUMS: ${{ needs.windows-build.outputs.checksums }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf '%s\n' "$CHECKSUMS" > "$RUNNER_TEMP/checksums.txt"
          sha256sum --check --strict "$RUNNER_TEMP/checksums.txt"
          # Every downloaded release asset must be one the build recorded: gh release create publishes release-assets/*.
          recorded=$(grep -c ' \*release-assets/' "$RUNNER_TEMP/checksums.txt")
          present=$(find release-assets -type f | wc -l)
          if [ "$recorded" -ne "$present" ]; then
            echo "::error::release-assets holds $present files but the build recorded $recorded."
            exit 1
          fi
          node scripts/release/assets.mjs verify release-assets "$VERSION"
      # Build provenance (SLSA Build L2) for everything a narrator can download (the zip, the setup program and their checksums, all in
      # release-assets), and for the executable inside the zip so it can be verified after extraction. The subjects are digests, checked
      # above against the ones the build job recorded. Before the prune and the release on purpose: if this step fails the run stops and
      # no release without provenance is published. Promote does not attest again: the same bytes keep the release candidate's attestation.
      - name: Attest the release assets and the executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*
            bin/narration-utils.exe
      # Keep the newest 10 RCs including the one being published, so nx still
      # finds the latest RC tag and bumps past it instead of re-stamping the same version.
      - name: Prune old release candidates
        env:
          KEEP_EXISTING: 9
        run: |
          stale=$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E -- '-rc$' | tail -n +$((KEEP_EXISTING + 1)) || true)
          for old in $stale; do
            gh release delete "$old" --cleanup-tag -y
          done
      # The notes script diffs against the previous stable tag, so it needs the candidate as a
      # local tag; `gh release create --target` then creates the remote tag in the same request.
      - name: Generate release notes
        run: |
          git tag "$TAG"
          node scripts/release/generate-notes.mjs "$TAG"
      - name: Create the prerelease with the Windows zip and setup program
        run: gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes-file release-notes.md
      # Each starts its own run, so a failed macOS or Linux build neither turns this run red nor
      # blocks promotion. Retry one by re-running its workflow, or dispatching it with the tag.
      - name: Start the optional macOS and Linux builds
        continue-on-error: true
        run: |
          gh workflow run build-macos.yml --ref "$GITHUB_REF_NAME" -f tag="$TAG"
          gh workflow run build-linux.yml --ref "$GITHUB_REF_NAME" -f tag="$TAG"
