name: Prerelease
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
permissions: { contents: read }
concurrency:
  group: prerelease
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.compute.outputs.release }}
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - id: compute
        name: Compute the next release candidate from conventional commits
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          # nx.json's releaseTag.pattern (v{version}-rc) makes nx treat the latest RC tag as the
          # current version and bump past it (v0.2.0-rc -> 0.2.1).
          pnpm exec nx release version
          node scripts/release/sync-version.mjs
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "No releasable changes since the latest release candidate; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-rc" >> "$GITHUB_OUTPUT"

  package:
    needs: [quality, version]
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/_build-native.yml
    with:
      upload: true
      artifact-prefix: unsigned-rc
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-rc-*
          path: dist
      # Keep the newest 10 RCs including the one being published, so nx still
      # finds the latest RC tag and bumps past it instead of re-stamping the same version.
      - name: Prune old release candidates
        env:
          KEEP_EXISTING: 9
        run: |
          stale=$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E -- '-rc$' | tail -n +$((KEEP_EXISTING + 1)) || true)
          for old in $stale; do
            gh release delete "$old" --cleanup-tag -y
          done
      - name: Tag this release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
      - name: Collect and checksum installers
        env:
          BUNDLE_DIRS: dist/unsigned-rc-windows-x64:dist/unsigned-rc-macos-arm64:dist/unsigned-rc-linux-x64
        run: node scripts/release/collect-assets.mjs
      - name: Generate release notes
        run: node scripts/release/generate-notes.mjs "$TAG"
      - name: Publish the prerelease
        run: gh release create "$TAG" release-assets/* --prerelease --title "$TAG" --notes-file release-notes.md
