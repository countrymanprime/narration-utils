name: Create unsigned beta
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions: { contents: read }
concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, args: '-nsis' }
          - { name: macos-x64, os: macos-13, args: '' }
          - { name: macos-arm64, os: macos-14, args: '' }
          - { name: linux-x64, os: ubuntu-latest, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Test and lint
        run: pnpm run check
      - name: Build native package
        run: |
          python scripts/release/prepare-resources.py --clean
          node scripts/release/verify-installable.mjs
          cd shell
          wails build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-beta-${{ matrix.name }}
          path: shell/build/bin
          if-no-files-found: error
