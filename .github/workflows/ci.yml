name: CI
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
  ui-dist:
    uses: ./.github/workflows/_ui-dist.yml
  # Windows is the supported platform, so it is the only native build a pull request waits on.
  # macOS and Linux build after the Windows release is published (see prerelease.yml).
  # This job needs only the UI bundle, so it runs alongside the quality jobs rather than after them.
  build-windows:
    name: Build (Windows)
    needs: ui-dist
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          platform: windows-x64
      # The packaged program, setup program, notices and checksums of this pull request, for a by-hand launch on Windows (the owner's
      # check of a shell change, for example the Wails v3 migration, docs/adr/0200). Never a release: releases are built by prerelease.yml.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: narration-utils-windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  # One check that sums up the run, for a ruleset to require (#544) instead of every job by name: sharding, folding or
  # renaming a job then changes nothing a ruleset lists, and a job skipped because Nx found nothing affected counts as
  # passed. `always()` so it reports red, not skipped, when a job it needs fails. A documentation-only pull request does
  # not run this workflow (paths-ignore above), so requiring this check also needs that trigger changed.
  ci-passed:
    name: CI passed
    needs: [quality, ui-dist, build-windows]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a job this run needs ended $result"; exit 1 ;;
            esac
          done
