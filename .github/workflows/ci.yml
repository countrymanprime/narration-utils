name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    name: Conventional Commit title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate the squash commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx --no -- commitlint

  quality:
    name: UI, Python, and Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/requirements-dev.txt
      - name: Install UI dependencies
        run: npm --prefix shared/ui ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r tools/requirements-dev.txt
      - name: UI lint, format, tests, and build
        run: |
          npm --prefix shared/ui run lint:ci
          npm --prefix shared/ui run format:check
          npm --prefix shared/ui test
          npm --prefix shared/ui run build
      - name: Python format, lint, and tests
        env:
          PYTHONPATH: shared/python
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest -q --basetemp .test-tmp
      - name: Rust format, lint, and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  scripting-quality:
    name: PowerShell and Lua style
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Check PowerShell
        shell: pwsh
        run: ./scripts/quality/invoke-powershell-analyzer.ps1 scripts
      - name: Install StyLua
        shell: pwsh
        run: cargo install stylua --version 2.1.0 --locked
      - name: Check Lua
        shell: pwsh
        run: stylua --check shared/reaper

  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            command: npm --prefix shell run build:windows
            artifact: target/release/bundle/nsis
          - name: macos-x64
            os: macos-13
            command: npm --prefix shell run build:macos
            artifact: target/release/bundle/dmg
          - name: macos-arm64
            os: macos-14
            command: npm --prefix shell run build:macos
            artifact: target/release/bundle/dmg
          - name: linux-x64
            os: ubuntu-latest
            command: npm --prefix shell run build:linux
            artifact: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/requirements-dev.txt
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install UI and Python build dependencies
        run: |
          npm --prefix shared/ui ci
          python -m pip install -r requirements.txt -r tools/requirements-dev.txt
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build first-party runtime resources
        run: |
          npm --prefix shared/ui run build
          python scripts/release/prepare-resources.py --clean
          node scripts/release/verify-installable.mjs
      - name: Build installer packages
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
