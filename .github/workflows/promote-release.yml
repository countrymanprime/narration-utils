name: Promote pre-release

on:
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: Existing release-candidate tag to promote, for example v0.2.0-rc
        required: true
        type: string

permissions: {}

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: write # to create the stable tag and release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate the selected candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          test "$(printf '%s' "$TAG" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)-rc$/ok/p')" = ok
          git fetch origin main --tags
          git merge-base --is-ancestor "$TAG" origin/main
          gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' | grep -x true
      - name: Download and verify the approved assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          mkdir prerelease-assets
          gh release download "$TAG" --dir prerelease-assets
          # Fails unless every platform's asset has been attached (macOS and Linux upload after
          # the Windows build publishes the release), matches its .sha256, and, with --attestations, has build
          # provenance from the release workflow on main (gh attestation verify; GITHUB_REPOSITORY is set by
          # Actions). A candidate built before attestations existed cannot be promoted; the next one can.
          node scripts/release/assets.mjs verify prerelease-assets --attestations
      - name: Create the stable tag and release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION%-rc}"
          STABLE_TAG="v${VERSION}"
          git rev-parse "$TAG"
          test -z "$(git tag --list "$STABLE_TAG")"
          # The local tag is what the notes script diffs against. The remote tag is created through the API
          # (a lightweight tag on the RC's commit, as `git push` made) so the checkout above needs no stored credential.
          COMMIT="$(git rev-parse "$TAG^{commit}")"
          git tag "$STABLE_TAG" "$COMMIT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$STABLE_TAG" -f sha="$COMMIT" > /dev/null
          node scripts/release/generate-notes.mjs "$STABLE_TAG"
          gh release create "$STABLE_TAG" prerelease-assets/* --title "$STABLE_TAG" --notes-file release-notes.md
