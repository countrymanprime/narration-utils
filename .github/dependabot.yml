version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /shared/ui
    schedule:
      interval: weekly
    groups:
      ui-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /shell
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
