version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /shared/ui
    schedule:
      interval: weekly
    groups:
      ui-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    groups:
      python-dev-tools:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
