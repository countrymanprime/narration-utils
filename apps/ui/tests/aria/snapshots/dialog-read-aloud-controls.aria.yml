# The read-aloud dialog's control bar (read-aloud-control-bar.prd.md Phases 3-6): a named toolbar, outside the dialog's
# scrolling body, with a Play/Pause toggle (Play and Pause share one button, `aria-pressed`, Phase 5, ADR 0248), Stop
# reading, the status and word count, Follow (enabled once the narrator scrolls by hand, ADR 0119), the microphone
# popover trigger (named by the chosen device; its level meter is decorative, Phase 4), the chapter's read-only REAPER
# state (Phase 6, ADR 0249) with its own Refresh, and Settings. The REAPER state button is gated by CapabilityGate over
# the DAW port's `record` capability (DAW port PRD Phase 7, ADR 0360): experimental and off by default, so it stays
# aria-disabled with the capability's own message as a hidden description - never the native `disabled` a `group`
# wrapper would read, since the gate itself, not the browser, has to stop the press.
- /children: equal
# The two toast live regions stay in the tree on purpose (see dialog-add-note.aria.yml).
- main:
  - alert
  - status
- 'dialog "Read aloud: Chapter 1 — Down the Rabbit-Hole"':
  - 'heading "Read aloud: Chapter 1 — Down the Rabbit-Hole" [level=2]'
  - button "Close"
  - toolbar "Reading controls":
    - button "Pause" [pressed]
    - button "Stop reading"
    - status: Listening
    - text: /\d+ of \d+,\d+ words/
    - button "Follow" [disabled]
    - 'button "Microphone: not chosen"'
    - 'button /Record in REAPER: Chapter armed/ [disabled]'
    - text: "Experimental: switched off in Settings."
    - button "Refresh REAPER state"
    - button "Settings"
