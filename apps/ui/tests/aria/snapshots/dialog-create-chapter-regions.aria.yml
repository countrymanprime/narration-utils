# The create-chapter-regions dialog (booth-actions-enablement.prd.md Phase 4): a modal dialog named for itself, with the two
# credits-track selects, a named table of the planned regions, a "Not planned" list of chapters still missing a track link
# (matched partially), a confirmation checkbox and Create N regions. The page behind it is aria-hidden.
- /children: equal
# The two toast live regions stay in the tree on purpose (see dialog-add-note.aria.yml); empty here.
- main:
  - alert
  - status
- dialog "Create chapter regions":
  - heading "Create chapter regions" [level=2]
  - button "Close"
  - paragraph: /Plan one REAPER region per chapter with a confirmed track link/
  - combobox "Opening credits track":
    - option "None"
    - option "Chapter 2" [selected]
  - combobox "Closing credits track":
    - option "None" [selected]
  - table "Chapter regions":
    - rowgroup:
      - row "Region Track Start End Status"
    - rowgroup:
      - row /^Opening credits Chapter 2/:
        - cell "New region"
      - row /^Chapter 1 Chapter 1/:
        - cell "New region"
  - paragraph: Not planned
  - list:
    - listitem: "Chapter 2: No track is linked to this chapter."
  - checkbox "Move an existing region that shares a chapter’s title, instead of adding a second one"
  - button "Cancel"
  - button "Create 2 regions"
  - text: Experimental
