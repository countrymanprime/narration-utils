# A count badge on Story Bible and Proof is spoken with the name ("Proof, 3"); the number is the host's, so it is matched, not pinned.
# The page list is pinned exactly and in order (`children: equal`): a page added, removed or moved fails here. Settings sits after it.
# Grouped by production stage (stage-navigation-and-page-replacement.prd.md Phase 1, ADR 0407 item 3): each group is
# a named `group`, so a group added, removed, renamed or reordered fails here too. Its visible heading text is also
# its accessible name (aria-labelledby), so the heading text itself is listed as the group's first child.
# Phase 2 made the Production page the Production group's item at `/`, in place of Home.
- complementary:
  - navigation:
    - /children: equal
    - group "Production":
      - /children: equal
      - text: Production
      - button "Production"
    - group "Prep":
      - /children: equal
      - text: Prep
      - button "Script"
      - button /Story Bible, \d+/
    - group "Record":
      - /children: equal
      - text: Record
      - button "Booth"
    - group "Review":
      - /children: equal
      - text: Review
      - button /Proof, \d+/
      - button "Pickups"
    - group "Finish":
      - /children: equal
      - text: Finish
      - button "Master & QC"
  - button "Settings"
