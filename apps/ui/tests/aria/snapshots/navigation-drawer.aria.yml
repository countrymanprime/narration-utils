# Below md the navigation is a modal drawer: a named dialog, the only thing in <body> besides the two empty toast live regions, holding the same list as the sidebar.
- /children: equal
# The two toast live regions stay in the tree on purpose: Base UI leaves live regions exposed behind a modal, so an error raised
# from inside a dialog is still announced. They are empty here, and they are the only thing under <main>.
- main:
  - alert
  - status
- dialog "Navigation":
  - heading "Navigation" [level=2]
  - button "Close navigation"
  - navigation:
    - /children: equal
    - button "Home"
    - button "Manuscript"
    - button "Proofing"
    - button "Story Bible"
    - button "Teleprompter"
    - button "Tracks"
  - button "Settings"
